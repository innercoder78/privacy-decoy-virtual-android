name: PDVA foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-image-windows:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Check out exact source for offline image controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; existing reviewed pin
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: false
      - name: Exercise standard-library image controls on Windows
        shell: pwsh
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/test-offline-image-inspect.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/test-frame-copy.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; docs/source-reference-catalog.md
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: false
      - name: Validate repository foundation
        run: |
          git rev-parse HEAD
          python3 .github/scripts/validate-foundation.py
          python3 .github/scripts/test-repository-validation.py
          python3 .github/scripts/validate-harness.py
          python3 .github/scripts/test-desktop-readiness.py
          python3 .github/scripts/test-offline-image-inspect.py
          python3 .github/scripts/test-frame-copy.py
      - name: Exercise native wait controls on host only
        run: |
          mkdir -p android/build/host-controls
          cc --version
          cc -std=c11 -O0 -Wall -Wextra -Werror android/gate0-harness/src/test/cpp/launch_wait_test.c -o android/build/host-controls/launch-wait-test
          # Keep the real test outside any expected-failure handling.
          timeout 5s android/build/host-controls/launch-wait-test > android/build/host-controls/results.txt
          cat android/build/host-controls/results.txt
          python3 - <<'PY'
          from pathlib import Path
          expected = [
              "immediate successful reap", "EINTR retry", "timeout and successful reap",
              "ECHILD without unsafe kill", "kill failure", "clock failure",
              "frozen-clock iteration bound",
          ]
          actual = Path("android/build/host-controls/results.txt").read_text().splitlines()
          if actual != ["PASS: " + name for name in expected]:
              raise SystemExit("Expected exactly seven distinct native scenario results")
          print("Native positive controls: 7/7")
          PY
      - name: Verify native assertion failure is observable
        run: |
          ulimit -c 0
          python3 - <<'PY'
          import signal
          import subprocess
          result = subprocess.run(
              ["android/build/host-controls/launch-wait-test", "--fail-assert"],
              capture_output=True, text=True, timeout=5, check=False,
          )
          if result.returncode != -signal.SIGABRT or "PDVA injected assertion failure" not in result.stderr:
              raise SystemExit(f"Expected injected assertion SIGABRT; got {result.returncode}: {result.stderr}")
          print("Native negative controls: 1/1 (injected assertion caused SIGABRT)")
          PY
      - name: Check whitespace
        run: git show --format= --check HEAD
      - name: Exercise dormant bootstrap with modeled syscalls and real host pthreads
        run: python3 .github/scripts/android-seccomp-bootstrap.py --model
      - name: Exercise real Linux worker lifetime and independent negative controls
        run: |
          ulimit -c 0
          timeout --signal=TERM --kill-after=15s 150s python3 .github/scripts/worker-lifetime-research.py
      - name: Exercise disposable seccomp process and thread controls
        run: |
          ulimit -c 0
          timeout --signal=TERM --kill-after=15s 100s python3 .github/scripts/seccomp-process-research.py
      - name: Exercise retained mappings and trusted-owner revocation controls
        run: |
          ulimit -c 0
          git rev-parse HEAD
          timeout --signal=TERM --kill-after=15s 140s python3 .github/scripts/revocation-research.py
