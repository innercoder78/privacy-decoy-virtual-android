name: PDVA foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; docs/source-reference-catalog.md
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: false
      - name: Validate repository foundation
        run: |
          git rev-parse HEAD
          python3 .github/scripts/validate-foundation.py
      - name: Check whitespace
        run: git show --format= --check HEAD
