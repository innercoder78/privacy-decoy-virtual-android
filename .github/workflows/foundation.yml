name: PDVA foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-image-windows:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Check out exact source for offline image controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; existing reviewed pin
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: false
      - name: Exercise standard-library image controls on Windows
        shell: pwsh
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/test-offline-image-inspect.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/test-frame-copy.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/test-gradle-distribution.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/test-installed-tools.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; docs/source-reference-catalog.md
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: false
      - name: Validate repository foundation
        run: |
          git rev-parse HEAD
          python3 .github/scripts/validate-foundation.py
          python3 .github/scripts/test-repository-validation.py
          python3 .github/scripts/validate-harness.py
          python3 .github/scripts/test-memory-diagnostic.py
          python3 .github/scripts/test-desktop-readiness.py
          python3 .github/scripts/test-offline-image-inspect.py
          python3 .github/scripts/test-frame-copy.py
          python3 .github/scripts/test-gradle-distribution.py
          python3 .github/scripts/test-installed-tools.py
      - name: Exercise native wait controls on host only
        run: |
          mkdir -p android/build/host-controls
          cc --version
          cc -std=c11 -O0 -Wall -Wextra -Werror android/gate0-harness/src/test/cpp/launch_wait_test.c -o android/build/host-controls/launch-wait-test
          # Keep the real test outside any expected-failure handling.
          timeout 5s android/build/host-controls/launch-wait-test > android/build/host-controls/results.txt
          cat android/build/host-controls/results.txt
          python3 - <<'PY'
          from pathlib import Path
          expected = [
              "immediate successful reap", "EINTR retry", "timeout and successful reap",
              "ECHILD without unsafe kill", "kill failure", "clock failure",
              "frozen-clock iteration bound",
          ]
          actual = Path("android/build/host-controls/results.txt").read_text().splitlines()
          if actual != ["PASS: " + name for name in expected]:
              raise SystemExit("Expected exactly seven distinct native scenario results")
          print("Native positive controls: 7/7")
          PY
      - name: Verify native assertion failure is observable
        run: |
          ulimit -c 0
          python3 - <<'PY'
          import signal
          import subprocess
          result = subprocess.run(
              ["android/build/host-controls/launch-wait-test", "--fail-assert"],
              capture_output=True, text=True, timeout=5, check=False,
          )
          if result.returncode != -signal.SIGABRT or "PDVA injected assertion failure" not in result.stderr:
              raise SystemExit(f"Expected injected assertion SIGABRT; got {result.returncode}: {result.stderr}")
          print("Native negative controls: 1/1 (injected assertion caused SIGABRT)")
          PY
      - name: Check whitespace
        run: git show --format= --check HEAD
      - name: Exercise dormant bootstrap with modeled syscalls and real host pthreads
        run: python3 .github/scripts/android-seccomp-bootstrap.py --model
      - name: Exercise real Linux worker lifetime and independent negative controls
        run: |
          ulimit -c 0
          timeout --signal=TERM --kill-after=15s 150s python3 .github/scripts/worker-lifetime-research.py
      - name: Exercise disposable seccomp process and thread controls
        run: |
          ulimit -c 0
          timeout --signal=TERM --kill-after=15s 100s python3 .github/scripts/seccomp-process-research.py
      - name: Exercise retained mappings and trusted-owner revocation controls
        run: |
          ulimit -c 0
          git rev-parse HEAD
          timeout --signal=TERM --kill-after=15s 140s python3 .github/scripts/revocation-research.py
      - name: Validate registered Rust cross-link self-tests on Linux
        timeout-minutes: 2
        shell: setpriv --no-new-privs bash --noprofile --norc -eu -o pipefail {0}
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export PATH="/usr/bin:$PATH" LC_ALL=C
          umask 077
          source_sha=$(git rev-parse HEAD)
          uid=$(id -u)
          caps=$(awk '/^CapEff:/{print $2}' /proc/self/status)
          nnp=$(awk '/^NoNewPrivs:/{print $2}' /proc/self/status)
          . /etc/os-release
          echo "source=$source_sha os=$ID-$VERSION_ID runner=${RUNNER_ENVIRONMENT:?} image=${ImageOS:?}/${ImageVersion:?} uid=$uid caps=$caps no_new_privs=$nnp"
          [[ $source_sha == "$EXPECTED_SOURCE" && $RUNNER_ENVIRONMENT == github-hosted ]]
          [[ $ID == ubuntu && $VERSION_ID == 24.04 && $uid != 0 && $caps =~ ^0+$ && $nnp == 1 ]]
          TMPDIR=$(mktemp -d "${RUNNER_TEMP:?}/cross-link.XXXXXXXX")
          export TMPDIR
          trap 'rm -rf -- "$TMPDIR"' EXIT
          ulimit -c 0
          ulimit -f 32768
          ulimit -t 30
          ulimit -v 4194304
          ulimit -n 256
          # native_artifact runs ar, readelf and llvm-objdump-18 with PATH=/usr/bin.
          # Only clang and ld.lld in fixture construction need private aliases.
          mkdir "$TMPDIR/bin"
          export PATH="$TMPDIR/bin:/usr/bin"
          missing=0
          resolve() {
            local tool=$1 pattern=$2 path version
            shift 2
            for path in "$@"; do
              [[ -f $path && -x $path ]] || { echo "$tool unavailable: $path"; continue; }
              if ! version=$(timeout 10s "$path" --version 2>/dev/null); then
                echo "$tool version query failed: $path"
                continue
              fi
              version=${version%%$'\n'*}
              if [[ ! $version =~ $pattern ]]; then
                echo "$tool unexpected version: $path"
                continue
              fi
              if [[ $tool == clang ]] && ! "$path" --print-targets | grep -E '^[[:space:]]*aarch64[[:space:]]+-' >/dev/null; then
                echo "$tool lacks AArch64 target: $path"
                continue
              fi
              if [[ $tool == clang || $tool == ld.lld ]]; then
                ln -s -- "$path" "$TMPDIR/bin/$tool"
              fi
              [[ $(type -P "$tool") -ef $path ]]
              echo "$tool path=$path version=${version:0:160}"
              return
            done
            echo "Missing required tool: $tool"
            missing=1
          }
          resolve python3 '^Python 3\.' /usr/bin/python3
          resolve clang '^(Ubuntu |Debian )?clang version 18\.' /usr/bin/clang-18 /usr/lib/llvm-18/bin/clang /usr/bin/clang
          resolve ld.lld '^((Ubuntu|Debian) )?LLD 18\.' /usr/bin/ld.lld-18 /usr/lib/llvm-18/bin/ld.lld /usr/bin/ld.lld
          resolve ar '^GNU ar ' /usr/bin/ar
          resolve readelf '^GNU readelf ' /usr/bin/readelf
          resolve llvm-objdump-18 'LLVM version 18\.' /usr/bin/llvm-objdump-18
          if [[ ! -x /usr/bin/llvm-objdump-18 && -x /usr/lib/llvm-18/bin/llvm-objdump ]]; then
            echo "LLVM directory contains llvm-objdump, but registered inspection requires /usr/bin/llvm-objdump-18"
          fi
          (( missing == 0 ))
          echo "Synthetic validation only. Rust compilation, Android runtime, isolation and Gate 0 feasibility remain unverified."
          failed=0
          run_test() {
            local result=0
            timeout --kill-after=2s 30s python3 -IB ".github/scripts/$1" "$2" > "$TMPDIR/test.log" 2>&1 || result=$?
            if (( result == 0 )); then
              echo "PASS $1 $2 exit=0"
            else
              local phase=self-test reason
              if (( result == 124 || result == 137 )); then
                phase=timeout-or-kill
              elif [[ $2 == --self-test-host-tools ]]; then
                if grep -q ', in native_artifact$' "$TMPDIR/test.log"; then
                  phase=artifact-inspection
                elif grep -q ', in assemble$' "$TMPDIR/test.log"; then
                  phase=fixture-assembly
                elif grep -qF "Command '('ld.lld'," "$TMPDIR/test.log"; then
                  phase=fixture-link
                elif grep -qF "Command '('ar'," "$TMPDIR/test.log"; then
                  phase=fixture-archive
                else
                  phase=fixture-setup
                fi
              fi
              reason=$(sed -nE 's/^(__main__\.)?Reject: ([a-z0-9-]{1,64})$/\2/p' "$TMPDIR/test.log" | tail -n 1)
              echo "FAIL $1 $2 exit=$result phase=$phase reason=${reason:-unclassified}"
              failed=1
            fi
          }
          run_test rust-cross-link.py --self-test
          run_test inspect-rust-cross-link.py --self-test
          run_test inspect-rust-cross-link.py --self-test-host-tools
          exit "$failed"
