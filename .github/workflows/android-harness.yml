name: PDVA Gate 0 substrate build
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/**'
      - '.gitignore'
      - '.gitattributes'
      - 'docs/evidence/gate-0-isolated-worker*'
      - 'docs/source-provenance-policy.md'
      - 'docs/source-reference-catalog.md'
  push:
    branches: [main, codex/gate0-apk-reproducibility]
    paths:
      - 'android/**'
      - '.github/**'
      - '.gitignore'
      - '.gitattributes'
      - 'docs/evidence/gate-0-isolated-worker*'
      - 'docs/source-provenance-policy.md'
      - 'docs/source-reference-catalog.md'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: false
          fetch-depth: 0 # Includes the exact reviewed historical source for both builds.
      - name: Repository and manifest hygiene
        run: |
          python3 .github/scripts/validate-foundation.py
          python3 .github/scripts/validate-harness.py
          git show --format= --check HEAD
      - name: Select runner JDK and install pinned Android packages
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          : "${ANDROID_HOME:?Runner ANDROID_HOME must identify the installed Android SDK}"
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          apkanalyzer_path="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          for tool_path in "$sdkmanager_path" "$apkanalyzer_path"; do
            if [[ ! -x "$tool_path" ]]; then
              echo "::error::Expected runner Android SDK tool is missing or not executable: $tool_path"
              exit 1
            fi
          done
          "$sdkmanager_path" --version
          echo "APK analyzer command-tool package identity:"
          cat "$ANDROID_HOME/cmdline-tools/latest/source.properties"
          "$sdkmanager_path" --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          cat "$ANDROID_HOME/platforms/android-37.0/source.properties"
          cat "$ANDROID_HOME/ndk/28.2.13676358/source.properties"
          cat "$ANDROID_HOME/build-tools/36.0.0/source.properties"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" version
          sha256sum "$ANDROID_HOME/build-tools/36.0.0/aapt2"
      - name: Build both variants and exercise protocol
        run: |
          python3 android/build.py :gate0-harness:assembleDebug :gate0-harness:assembleRelease :gate0-harness:assembleDebugAndroidTest :gate0-harness:protocolTest :gate0-harness:lintDebug
      - name: Cross-build and inspect dormant seccomp bootstrap without executing it
        run: python3 .github/scripts/android-seccomp-bootstrap.py --ndk "$ANDROID_HOME/ndk/28.2.13676358"
      - name: Inspect release APK authority and native inventory
        run: |
          apkanalyzer_path="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          if [[ ! -x "$apkanalyzer_path" ]]; then
            echo "::error::Expected runner Android APK analyzer is missing or not executable: $apkanalyzer_path"
            exit 1
          fi
          python3 .github/scripts/validate-harness.py --apkanalyzer "$apkanalyzer_path" --apk android/gate0-harness/build/outputs/apk/release/gate0-harness-release.apk
          python3 .github/scripts/validate-harness.py --apkanalyzer "$apkanalyzer_path" --apk android/gate0-harness/build/outputs/apk/debug/gate0-harness-debug.apk --variant debug
          python3 .github/scripts/test-packaged-rules.py --apkanalyzer "$apkanalyzer_path" \
            --apk android/gate0-harness/build/outputs/apk/release/gate0-harness-release.apk \
            --android-jar "$ANDROID_HOME/platforms/android-37.0/android.jar"
          # Hash source/tool identities alongside package bytes; never execute the ARM64 payload here.
          sha256sum android/gate0-harness/src/main/cpp/launch* android/gate0-harness/build.gradle android/gradle/verification-metadata.xml
          sha256sum "$ANDROID_HOME/ndk/28.2.13676358/source.properties" "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          unzip -l android/gate0-harness/build/outputs/apk/release/gate0-harness-release.apk
          sha256sum android/gate0-harness/build/outputs/apk/release/gate0-harness-release.apk
      - name: Record offline release artifact correspondence privately
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          apk=android/gate0-harness/build/outputs/apk/release/gate0-harness-release.apk
          apk_sha="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          native=android/gate0-harness/build/intermediates/stripped_native_libs/release/stripReleaseDebugSymbols/out/lib
          journal="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          common=(--journal "$journal" --source "$source_sha" --apk-sha256 "$apk_sha" --variant release)
          python3 .github/scripts/desktop-readiness.py init "${common[@]}"
          python3 .github/scripts/desktop-readiness.py prepare "${common[@]}" --operation release-inspection
          python3 .github/scripts/desktop-readiness.py inspect "${common[@]}" --operation release-inspection \
            --apk "$apk" --apkanalyzer "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" \
            --native "lib/arm64-v8a/libsubstrate.so=$native/arm64-v8a/libsubstrate.so" \
            --native "lib/x86_64/libsubstrate.so=$native/x86_64/libsubstrate.so" \
            --native "lib/arm64-v8a/libpdva_launch.so=$native/arm64-v8a/libpdva_launch.so"
          # No journal, APK, signing material or private path upload/log dump.
      - name: Exercise independent APK comparison failure controls
        run: python3 .github/scripts/test-apk-reproducibility.py
      - name: Build reviewed main twice in isolated output and dependency directories
        run: python3 .github/scripts/apk-reproducibility.py
